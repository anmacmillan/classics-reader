<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classics — Manon &amp; Margot</title>
  <meta name="theme-color" content="#111318">
  <link rel="manifest" href="manifest.json">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260721-4">
</head>
<body>
  <header class="app-header">
    <button id="back-btn" class="btn header-back" style="display: none;">← Bibliotheek</button>
    <div id="header-context" class="header-context">
      <strong id="header-primary">Library</strong>
      <span id="header-secondary">Latin · Greek</span>
    </div>
    <button id="theme-btn" class="btn header-theme" aria-label="Toggle theme">Dark</button>
    <span id="offline-status" title="Offline availability">Preparing offline…</span>
    <button id="vocabulary-btn" class="btn header-vocabulary" aria-controls="vocabulary-panel">
      Words <span id="vocabulary-count">0</span>
    </button>
  </header>
  
  <!-- Splash Screen: tesselated book selector -->
  <section id="splash-screen" class="splash-screen">
    <div id="book-grid"></div>
  </section>

  <!-- Main Reader Workspace -->
  <main id="app-workspace" class="app-workspace" hidden>
    <div class="reader-container">
      <div class="reader-pane">
        <div id="reader-content" class="reader-content"></div>
      </div>
    </div>
    <!-- Chapter Selector -->
    <div class="chapter-bar">
      <select id="chapter-select" class="chapter-select">
        <option>— Kies hoofdstuk —</option>
      </select>
    </div>
    <!-- Page Controls -->
    <div class="reader-controls">
      <button id="prev-page" class="btn-control" onclick="prevPage()">← Vorige</button>
      <span id="page-indicator" class="page-indicator">1 / 1</span>
      <button id="next-page" class="btn-control" onclick="nextPage()">Volgende →</button>
    </div>
  </main>

  <!-- Floating Word Tooltip -->
  <div id="word-tooltip" class="word-tooltip hidden">
    <div class="tooltip-arrow"></div>
    <div class="tooltip-content" id="tooltip-content"></div>
  </div>

  <aside id="vocabulary-panel" class="vocabulary-panel hidden" aria-label="Personal vocabulary">
    <div class="vocabulary-panel-header">
      <div>
        <h2>My words</h2>
        <p id="vocabulary-summary">0 saved words</p>
      </div>
      <button id="vocabulary-close" class="btn vocabulary-close" aria-label="Close vocabulary">×</button>
    </div>
    <div id="vocabulary-list" class="vocabulary-list"></div>
    <div class="vocabulary-actions">
      <button id="export-vocabulary-csv" class="btn">Export CSV</button>
      <button id="export-vocabulary-json" class="btn">Export JSON</button>
    </div>
  </aside>
  <div id="vocabulary-backdrop" class="vocabulary-backdrop hidden"></div>

  <script src="data.js?v=20260608-6"></script>
  <script src="generated/imported-books.js?v=20260723-4"></script>
  <script src="dictionary.js?v=20260721-1"></script>
  <script src="generated/imported-latin-dictionary.js?v=20260722-5"></script>
  <script src="generated/imported-greek-dictionary.js?v=20260723-4"></script>
  <script src="generated/imported-old-english-dictionary.js?v=20260609-1"></script>
  <script src="app.js?v=20260722-2"></script>
  <script>
    const offlineStatus = document.getElementById("offline-status");
    function updateOfflineStatus(ready) {
      offlineStatus.textContent = navigator.onLine ? (ready ? "Offline ready" : "Preparing offline…") : "Offline mode";
    }
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").then(registration => {
        const worker = registration.installing || registration.waiting || registration.active;
        updateOfflineStatus(worker && worker.state === "activated");
        if (worker) worker.addEventListener("statechange", () => updateOfflineStatus(worker.state === "activated"));
      }).catch(() => { offlineStatus.textContent = "Offline unavailable"; });
    }
    window.addEventListener("online", () => updateOfflineStatus(!!navigator.serviceWorker.controller));
    window.addEventListener("offline", () => updateOfflineStatus(true));
  </script>
</body>
</html>
