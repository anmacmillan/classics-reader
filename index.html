<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classics Reader — Manon &amp; Margot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <span class="logo" style="font-size: 1.2rem;">🔥 Classics</span>
      </div>
      <div class="header-center" id="header-center">
        <span id="reader-title" style="color: var(--text-muted); font-size: 0.85rem;">Latin · Ancient Greek</span>
      </div>
    </header>

    <div class="workspace-body">
      <div id="splash-screen" class="splash-screen"></div>
      <div id="app-workspace" class="app-workspace" style="display: none;">
        <div id="reader-pane" class="reader-pane"></div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="dictionary.js"></script>
  <script src="app.js"></script>
</body>
</html>
